name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: javac -d out src/Main.java

      - name: Package JAR
        run: jar cfe gravity-probe-simulator.jar Main -C out .

      - name: Smoke test (basic values)
        run: echo 1 | java -jar gravity-probe-simulator.jar | tail -n 8

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: gravity-probe-simulator
          path: gravity-probe-simulator.jar
